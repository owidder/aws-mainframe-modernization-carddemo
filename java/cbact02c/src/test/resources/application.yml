spring:
  application:
    name: carddemo-cbact02c-test

  datasource:
    url: jdbc:h2:mem:carddemo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations:   classpath:db/data.sql

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false    # tests launch the job manually via JobLauncherTestUtils

  h2:
    console:
      enabled: false

logging:
  level:
    com.carddemo: DEBUG
    org.springframework.batch: WARN
