spring:
  application:
    name: carddemo-cbact02c

  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none        # schema created by schema.sql
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations:   classpath:db/data.sql

  batch:
    jdbc:
      initialize-schema: always   # create Spring Batch metadata tables in H2
    job:
      enabled: true               # run cardPrintJob on startup, then exit

  h2:
    console:
      enabled: false

logging:
  level:
    com.carddemo: INFO
    org.springframework.batch: INFO
