// Root build file — shared configuration for all CardDemo microservice modules.
// Each subproject applies 'org.springframework.boot' and 'io.spring.dependency-management'
// without repeating the version (resolved from the declarations here).

plugins {
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

subprojects {
    apply plugin: 'java'

    group   = 'com.carddemo'
    version = '1.0.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    test {
        useJUnitPlatform()
    }
}
